const sb = async (path, opts = {}) => {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, "Content-Type": "application/json", Prefer: "return=representation", ...opts.headers },
    ...opts,

  if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

};
const PC_RATES = [0.04,0.05,0.06,0.07,0.08,0.09,0.10];
const calcPlanA = (pcPrem, lifeApps, lifeMoPrem, healthPol) => {
  const met = pcPrem >= 25000;
  const rate = met ? PC_RATES[Math.min(lifeApps, 6)] : 0;
  const pc = pcPrem * rate, life = (lifeMoPrem||0)*12*0.15, hlth = (healthPol||0)*24;
  return { pcComp:pc, lifeComp:life, healthComp:hlth, total:pc+life+hlth, rate:(rate*100).toFixed(0), thresholdMet:met, gap:Math.max(0,25000-pcPrem) };
};
const calcROI = (annTotCost, comp, revenue) => {
  const base = annTotCost/12, cc = comp*1.0765, total = base+cc, net = revenue-total;
  return { base, compCost:cc, totalCost:total, net, roiPct: total>0?(net/total)*100:0 };

const calcRevenue = (pcPrem, lifeMoPrem, healthPol) => pcPrem*0.08 + (lifeMoPrem||0)*12*0.15 + (healthPol||0)*24;
const aggEntries = (entries=[]) => entries.reduce((a,e) => {

const SalesEntryForm = ({staffId,onSuccess}) => {
  const [lob,setLob]=useState("auto");const [count,setCount]=useState("1");const [prem,setPrem]=useState("");const [lifeMo,setLifeMo]=useState("");const [date,setDate]=useState(new Date().toISOString().split("T")[0]);const [saving,setSaving]=useState(false);const [ok,setOk]=useState("");const [err,setErr]=useState("");
  const now=new Date();const meta=LOBs.find(l=>l.v===lob);

  return <Card><div style={{fontSize:17,fontWeight:800,color:C.text,marginBottom:18}}>Log a Sale</div><div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginBottom:18}}>{LOBs.map(l=><button key={l.v} onClick={()=>{setLob(l.v);setErr("");}} style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"9px 4px",borderRadius:12,border:`1px solid ${lob===l.v?C.accent:C.dim}`,background:lob===l.v?`${C.accent}20`:"#0a0a12",color:lob===l.v?"#fff":C.muted,cursor:"pointer",fontSize:10,fontWeight:600}}><span style={{fontSize:20,marginBottom:3}}>{l.icon}</span>{l.label}</button>)}</div>{meta.tip&&<div style={{background:"#0a0a12",border:`1px solid ${C.dim}`,borderRadius:10,padding:"9px 13px",fontSize:11,color:C.muted,marginBottom:14}}>{meta.tip}</div>}<div style={{display:"flex",flexDirection:"column",gap:14}}><div><div style={{fontSize:11,color:C.muted,fontWeight:600}}>Date</div><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={inp}/></div><div><div style={{fontSize:11,color:C.muted,fontWeight:600}}>{lob==="life"?"Applications Issued":"Policies Issued"}</div><input type="number" min="1" value={count} onChange={e=>setCount(e.target.value)} style={inp} placeholder="1"/></div>{meta.needsPrem&&<div><div style={{fontSize:11,color:C.muted,fontWeight:600}}>Written Premium ($)</div><input type="number" min="0" step="0.01" value={prem} onChange={e=>setPrem(e.target.value)} style={inp} placeholder="1,200.00"/></div>}{meta.needsLife&&<div><div style={{fontSize:11,color:C.muted,fontWeight:600}}>Monthly Premium ($)</div><input type="number" min="0" step="0.01" value={lifeMo} onChange={e=>setLifeMo(e.target.value)} style={inp} placeholder="75.00"/></div>}{err&&<div style={{color:C.red,fontSize:12}}>{err}</div>}{ok&&<div style={{color:C.green,fontSize:13,fontWeight:700}}>{ok}</div>}<button onClick={handle} disabled={saving} style={{padding:"14px 0",background:saving?"#4a0010":C.accent,color:"#fff",border:"none",borderRadius:12,fontSize:16,fontWeight:800,cursor:"pointer",opacity:saving?0.7:1,marginTop:4}}>{saving?"Saving\u2026":"Save Entry"}</button></div></Card>;

lifeApps!==1?"s":""}`:""})`,val:comp.pcComp},{label:`Life (${g.lifeApps} app${g.lifeApps!==1?"s":""} \u00b7 ${$f(g.lifeMo)}/mo \u00d7 12 \u00d7 15%)`,val:comp.lifeComp},{label:`Health (${g.healthP} pol. \u00d7 $24)`,val:comp.healthComp}].map(r=><div key={r.label} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><span style={{fontSize:13,color:C.muted}}>{r.label}</span><span style={{fontSize:14,color:C.text,fontWeight:700}}>{$f(r.val)}</span></div>)}<Divider/><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:15,color:C.text,fontWeight:800}}>Total Est. Commission</span><span style={{fontSize:28,fontWeight:900,color:C.green}}>{$f(comp.total)}</span></div><div style={{fontSize:10,color:"#374151",marginTop:10}}>Estimate only. Final payout confirmed by agency owner.</div></Card>}{entries.length>0&&<Card><div style={{fontSize:14,fontWeight:800,color:C.text,marginBottom:12}}>Recent Entries ({entries.length})</div><div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:240,overflowY:"auto"}}>{[...entries].reverse().slice(0,15).map(e=>{const lm=LOBs.find(l=>l.v===e.line_of_business);const dv=e.line_of_business==="health"?"$24 flat":e.line_of_business==="life"?$f(e.life_monthly_premium||0)+"/mo":$f(e.premium_written);return <div key={e.id} style={{display:"flex",alignItems:"center",gap:10,background:"#0a0a12",borderRadius:10,padding:"9px 12px"}}><span style={{fontSize:20}}>{lm?.icon}</span><div style={{flex:1}}><div style={{fontSize:13,color:C.text,fontWeight:600,textTransform:"capitalize"}}>{e.line_of_business} \u00b7 {e.policies_count} pol.</div><div style={{fontSize:11,color:C.muted}}>{e.entry_date}</div></div><div style={{fontSize:13,color:C.text,fontWeight:700}}>{dv}</div></div>;})}}</Card>}{entries.length===0&&!loading&&<Card style={{textAlign:"center",padding:"28px 20px"}}><div style={{fontSize:32,marginBottom:10}}>\uD83D\uDCCB</div><div style={{color:C.muted,font   const g=aggEntries(entries);const pcP=g.autoP$+g.fireP$;const comp=calcPlanA(pcP,g.lifeApps,g.lifeMo,g.healthP);const rev=calcRevenue(pcP,g.lifeMo,g.healthP);const roi=calcROI(+emp.annual_total_cost,comp.total,rev);
  const bePC=roi.totalCost>0?roi.totalCost/0.08:0;const roiColor=roi.roiPct>=20?C.green:roi.roiPct>=0?C.amber:C.red;
  return <Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}><div><div style={{fontSize:19,fontWeight:900,color:C.text}}>{emp.employee_name}</div><div style={{display:"flex",gap:8,marginTop:7,flexWrap:"wrap"}}><Tag color="blue">Plan {emp.comp_plan}</Tag><Tag color={roi.net>=0?"green":"red"}>{roi.net>=0?"\u2713 ROI Positive":"\u26a0 Net Negative"}</Tag></div></div><div style={{textAlign:"right"}}><div style={{fontSize:34,fontWeight:900,color:roiColor,lineHeight:1}}>{pf(roi.roiPct)}</div><div style={{fontSize:10,color:C.muted,marginTop:3}}>ROI this month</div></div></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}><MBox label="Revenue" value={$f(rev)}/><MBox label="Total Cost" value={$f(roi.totalCost)}/><MBox label="Net Value" value={$f(roi.net)} color={roi.net>=0?C.green:C.red}/></div><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:12}}>{[{l:"Auto",v:g.autoP,t:emp.monthly_target_auto||22},{l:"Home",v:g.fireP,t:emp.monthly_target_fire||13},{l:"Life",v:g.lifeApps,t:emp.monthly_target_life||6},{l:"Health",v:g.healthP,t:2}].map(item=><div key={item.l} style={{background:"#0a0a12",border:`1px solid ${C.border}`,borderRadius:10,padding:"9px 6px",textAlign:"center"}}><div style={{fontSize:20,fontWeight:900,color:item.v>=item.t?C.green:C.text}}>{item.v}</div><div style={{fontSize:10,color:C.muted}}>{item.l}</div><div style={{fontSize:9,color:"#374151"}}>/{item.t}</div></div>)}</div><button onClick={()=>setOpen(!open)} style={{width:"100%",background:"transparent",border:"none",color:C.muted,fontSize:11,cursor:"pointer",padding:"4px 0",borderTop:`1px solid ${C.border}`,marginTop:4,paddingTop:10}}>{open?"\u25b2 Hide Cost Detail":"\u25bc Show Cost Detail"}</button>{open&&<div style={{marginTop:12,paddingTop:12}}>{[{l:"Base salary (monthly)",v:roi.base},{l:`Commission \u2014 Plan ${emp.comp_plan}`,v:comp.total},{l:"ER taxes on comp (7.65%)",v:comp.total*0.0765}].map(r=><div key={r.l} style={{display:"flex",justifyContent:"space-between",marginBottom:9,fontSize:13}}><span style={{color:C.muted}}>{r.l}</span><span style={{color:C.text,fontWeight:600}}>{$f(r.v)}</span></div>)}<Divider/><div style={{display:"flex",justifyContent:"space-between",fontWeight:800,fontSize:14,marginBottom:12}}><span style={{color:C.text}}>Total Monthly Cost</span><span style={{color:C.text}}>{$f(roi.totalCost)}</span></div><div style={{display:"flex",flexDirection:"column",gap:6,fontSize:12,marginBottom:14}}>{[{l:`P&C comp (${comp.rate}% rate)`,v:comp.pcComp},{l:"Life comp",v:comp.lifeComp},{l:"Health comp",v:comp.healthComp}].map(r=><div key={r.l} style={{display:"flex",justifyContent:"space-between"}}><span style={{color:"#374151"}}>{r.l}</span><span style={{color:C.muted}}>{$f(r.v)}</span></div>)}</div><div style={{background:"#0a0a12",borderRadius:11,padding:"12px 14px",fontSize:11,color:C.muted,lineHeight:1.7}}><div>\uD83D\uDCCA Break-even P&C: <b style={{color:C.text}}>{$f(bePC)}</b></div><div>Current: {$f(pcP)} \u00b7 Gap: {$f(Math.max(0,bePC-pcP))}</div><div style={{color:"#374151"}}>Salary: {$f(emp.annual_gross)} \u00b7 Total cost: {$f(emp.annual_total_cost)}</div></div></div>}</Card>;
};
const OwnerDashboard = ({user,onLogout}) => {
  const [producers,setProducers]=useState([]);const [allEntries,setAllEntries]=useState([]);const [loading,setLoading]=useState(true);const [tab,setTab]=useState("roster");
  const now=new Date();const yr=now.getFullYear(),mo=now.getMonth()+1;
  useEffect(()=>{ const load=async()=>{ setLoading(true); try{ const emps=await sb(`employees?select=*&client_id=eq.${CLIENT}&status=eq.active&is_owner=eq.false&order=employee_name.asc`); setProducers(emps); const ents=await sb(`producer_sales_entries?select=*&agency_id=eq.${AGENCY}&period_year=eq.${yr}&period_month=eq.${mo}`); setAllEntries(ents); }catch(e){console.error(e);} finally{setLoading(false);}; }; load(); },[yr,mo]);
  const agency=aggEntries(allEntries);const pcTotal=agency.autoP$+agency.fireP$;
  const totals=producers.reduce((acc,emp)=>{ const g=aggEntries(allEntries.filter(e=>e.staff_id===emp.id));const pc=g.autoP$+g.fireP$;const c=calcPlanA(pc,g.lifeApps,g.lifeMo,g.healthP);const r=calcRevenue(pc,g.lifeMo,g.healthP);const ro=calcROI(+emp.annual_total_cost,c.total,r); acc.comp+=c.total;acc.base+=ro.base;acc.rev+=r;acc.cost+=ro.totalCost;acc.net+=ro.net; return acc; },{comp:0,base:0,rev:0,cost:0,net:0});
  const chartData=producers.map(emp=>{ const g=aggEntries(allEntries.filter(e=>e.staff_id===emp.id));const pc=g.autoP$+g.fireP$;const c=calcPlanA(pc,g.lifeApps,g.lifeMo,g.healthP);const r=calcRevenue(pc,g.lifeMo,g.healthP);const ro=calcROI(+emp.annual_total_cost,c.total,r); return {name:emp.employee_name.split(",")[0].split(" ")[0],revenue:Math.round(r),cost:Math.round(ro.totalCost),net:Math.round(ro.net)}; });
  const fmtK=v=>v>=1000?`$${(v/1000).toFixed(0)}K`:`$${v}`;
  const SBC=({data})=>{ if(!data||data.length===0)return null; const mV=Math.max(...data.map(d=>Math.max(d.revenue||0,d.cost||0)),1);const H=120,pad=30,bW=28,gap=8;const gW=bW*2+gap;const tW=data.length*(gW+16); return <div style={{overflowX:"auto"}}><svg width={Math.max(tW+pad*2,320)} height={H+50} style={{display:"block"}}>{data.map((d,i)=>{ const x=pad+i*(gW+16);const rH=((d.revenue||0)/mV)*H;const cH=((d.cost||0)/mV)*H; return <g key={d.name}><rect x={x} y={H-rH} width={bW} height={rH} fill={C.green} rx={3}/><rect x={x+bW+gap} y={H-cH} width={bW} height={cH} fill={C.red} rx={3}/><text x={x+bW} y={H+14} textAnchor="middle" fill={C.muted} fontSize="11">{d.name}</text>{d.revenue>0&&<text x={x+bW/2} y={H-rH-4} textAnchor="middle" fill={C.green} fontSize="9">{fmtK(d.revenue)}</text>}{d.cost>0&&<text x={x+bW+gap+bW/2} y={H-cH-4} textAnchor="middle" fill={C.red} fontSize="9">{fmtK(d.cost)}</text>}</g>; })}<line x1={pad-5} y1={0} x2={pad-5} y2={H} stroke={C.border}/><line x1={pad-5} y1={H} x2={Math.max(tW+pad*2,320)-pad} y2={H} stroke={C.border}/></svg><div style={{display:"flex",gap:16,fontSize:11,color:C.muted,marginTop:4,justifyContent:"center"}}><span>\u25cf <span style={{color:C.green}}>Revenue</span></span><span>\u25cf <span style={{color:C.red}}>Cost</span></span></div></div>; };
  return <div style={{minHeight:"100vh",background:C.bg}}><NavBar title="Owner Dashboard" sub={`Simpson Insurance \u00b7 ${MONTHS[mo-1]} ${yr}`} onLogout={onLogout}/><TabBar tabs={[{id:"roster",label:"Producer ROI"},{id:"agency",label:"Agency Summary"}]} active={tab} onChange={setTab}/><div style={{maxWidth:700,margin:"0 auto",padding:"20px 16px"}}>{tab==="roster"&&(loading?<Spinner/>:<div><div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:20}}><MBox label="Producers" value={producers.length}/><MBox label="Agency Revenue" value={$f(totals.rev)} color={C.green}/><MBox label="Total Staff Cost" value={$f(totals.cost)}/><MBox label="Net Producer Value" value={$f(totals.net)} color={totals.net>=0?C.green:C.red}/></div>{producers.length===0?<Card style={{textAlign:"center",padding:"32px 20px"}}><div style={{fontSize:32,marginBottom:10}}>\uD83D\uDC65</div><div style={{color:C.muted}}>No active producers yet.</div></Card>:producers.map(emp=><ProducerROICard key={emp.id} emp={emp} entries={allEntries.filter(e=>e.staff_id===emp.id)}/>)}{producers.length>0&&<Card><div style={{fontSize:14,fontWeight:800,color:C.text,marginBottom:16}}>Revenue vs. Cost by Producer</div><SBC data={chartData}/></Card>}</div>)}{tab==="agency"&&(loading?<Spinner/>:<div><Card><div style={{fontSize:17,fontWeight:900,color:C.text,marginBottom:16}}>Agency Production \u00b7 {MONTHS[mo-1]} {yr}</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}><MBox label="Auto Policies" value={agency.autoP} sub={$f(agency.autoP$)+" premium"}/><MBox label="Home Policies" value={agency.fireP} sub={$f(agency.fireP$)+" premium"}/><MBox label="Life Apps" value={agency.lifeApps} sub={$f(agency.lifeMo*12)+" ann. prem."}/><MBox label="Health Policies" value={agency.healthP} sub={$f(agency.healthP*24)+" comp"}/></div><Prog value={pcTotal} max={producers.length*25000} label="P&C vs. Combined Thresholds" right={$f(pcTotal)}/></Card><Card><div style={{fontSize:17,fontWeight:900,color:C.text,marginBottom:14}}>Compensation Summary</div>{[{l:"Total Base Payroll (monthly)",v:totals.base},{l:"Estimated Commission",v:totals.comp},{l:"ER Taxes on Commission (7.65%)",v:totals.comp*0.0765}].map(r=><div key={r.l} style={{display:"flex",justifyContent:"space-between",marginBottom:11,fontSize:13}}><span style={{color:C.muted}}>{r.l}</span><span style={{color:C.text,fontWeight:700}}>{$f(r.v)}</span></div>)}<Divider/><div style={{display:"flex",justifyContent:"space-between",fontWeight:900,fontSize:15,marginBottom:9}}><span>Total Staff Cost</span><span>{$f(totals.cost)}</span></div><div style={{display:"flex",justifyContent:"space-between",fontWeight:900,fontSize:15,marginBottom:9}}><span>Agency Revenue</span><span style={{color:C.green}}>{$f(totals.rev)}</span></div><Divider/><div style={{display:"flex",justifyContent:"space-between",fontWeight:900,fontSize:17}}><span>Net Producer Value</span><span style={{color:totals.net>=0?C.green:C.red}}>{$f(totals.net)}</span></div></Card><div style={{textAlign:"center",color:"#374151",fontSize:10,paddingBottom:24}}>Revenue uses 8% SMVC rate as SF comp proxy.</div></div>)}</div></div>;
};
const App = () => {
  const [user,setUser]=useState(null);const [logging,setLogging]=useState(false);
  const login=async(pin,setErr)=>{ setLogging(true); try{ const rows=await sb(`employees?select=*&portal_pin=eq.${pin}&status=eq.active&client_id=eq.${CLIENT}`); if(!rows.length){setErr("Invalid PIN. Please try again.");return;} setUser(rows[0]); }catch(e){setErr("Connection error \u2014 "+e.message);} finally{setLogging(false);}; };
  if(!user) return <LoginScreen onLogin={login} loading={logging}/>;
  if(user.comp_plan==="owner"||user.is_owner) return <OwnerDashboard user={user} onLogout={()=>setUser(null)}/>;
  return <ProducerPortal user={user} onLogout={()=>setUser(null)}/>;
};
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
